<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENAI – Visão 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #00264D; font-family: "Outfit", "Segoe UI", Arial, sans-serif; }
  .voltar {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    background: #003A70; color: #fff; text-decoration: none;
    font-weight: 600; padding: 10px 20px; border-radius: 999px;
    border: 2px solid #F47920;
  }
  .voltar:hover { background: #F47920; }
  .voltar:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .dica {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10;
    background: rgba(0,38,77,.85); color: #fff; padding: 8px 18px;
    border-radius: 999px; font-size: .95rem; pointer-events: none; text-align: center;
  }
</style>

<script>
  // Ao "olhar" para o ponto por 1,5 s (ou tocar nele), o vídeo aparece e toca
  AFRAME.registerComponent('abre-video', {
    init: function () {
      const video = document.querySelector('#vid');
      const tela = document.querySelector('#tela-video');
      this.el.addEventListener('click', () => {
        tela.setAttribute('visible', true);
        video.play();
      });
    }
  });
</script>
</head>

<body>
<a class="voltar" href="index.html">Voltar</a>
<div class="dica">Gire o celular ou arraste para olhar ao redor</div>

<a-scene vr-mode-ui="enabled: true">
  <a-assets>
    <!-- ✏️ TROQUE AQUI: imagem panorâmica 360° e vídeo -->
    <img id="sala1" src="panorama.jpeg" crossorigin="anonymous">
    <video id="vid" src="video.mp4" loop crossorigin="anonymous" playsinline></video>
  </a-assets>

  <a-sky src="#sala1"></a-sky>

  <!-- Ponto clicável: olhe por 1,5 s para abrir o vídeo. Mude a posição se precisar -->
  <a-sphere class="clicavel" abre-video
            position="2 1.6 -4" radius="0.25" color="#F47920"
            animation="property: scale; to: 1.25 1.25 1.25; dir: alternate; loop: true; dur: 900">
  </a-sphere>

  <a-video id="tela-video" src="#vid" position="0 1.6 -3"
           width="3" height="1.7" visible="false"></a-video>

  <a-entity camera look-controls position="0 1.6 0">
    <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .clicavel"></a-cursor>
  </a-entity>
</a-scene>
</body>
</html>
